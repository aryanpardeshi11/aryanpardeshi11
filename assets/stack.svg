<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#091022"/>
    </linearGradient>

    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="stack-core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <pattern id="stack-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#247bff" fill-opacity="0.08"/>
    </pattern>

    <filter id="stack-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .stack-anim { animation: none !important; }
    }
    .stack-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .stack-display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .stack-chip-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; }
  </style>

  <!-- Card Background -->
  <rect x="1.5" y="1.5" width="857" height="417" rx="18" fill="url(#stack-bg)"/>
  <rect x="1.5" y="1.5" width="857" height="417" rx="18" fill="url(#stack-dots)"/>
  <rect x="1.5" y="1.5" width="857" height="417" rx="18" fill="none" stroke="url(#stack-border)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(42, 34)">
    <text x="0" y="0" class="stack-mono" font-size="12" font-weight="700" fill="#247bff" letter-spacing="2">
      // SYSTEM ARCHITECTURE &amp; ORBITAL TECH MATRIX
    </text>
    <text x="776" y="0" text-anchor="end" class="stack-mono" font-size="11" fill="#64748b">RESONANCE LEVEL: 99.4%</text>
  </g>

  <!-- ==================== TOP: THREE TILTED ELLIPTICAL ORBITS ==================== -->
  <g transform="translate(430, 132)">
    <!-- Central Core -->
    <circle cx="0" cy="0" r="28" fill="#070b16" stroke="url(#stack-core-glow)" stroke-width="2.5" filter="url(#stack-glow)"/>
    <text x="0" y="-3" text-anchor="middle" class="stack-mono" font-size="11" font-weight="800" fill="#ffffff">PYTHON</text>
    <text x="0" y="12" text-anchor="middle" class="stack-mono" font-size="9" font-weight="700" fill="#38bdf8">AI CORE</text>

    <!-- Pulsing wave from center -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="28; 58" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6; 0" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ORBIT 1: Inner Orbit (AI & Agentic Frameworks) -->
    <g transform="rotate(-15)">
      <ellipse cx="0" cy="0" rx="150" ry="46" fill="none" stroke="#247bff" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="5 3"/>
      
      <!-- Planet: LangGraph -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="14s" repeatCount="indefinite"/>
        <g transform="translate(150, 0)">
          <circle cx="0" cy="0" r="13" fill="#0a1226" stroke="#247bff" stroke-width="1.8"/>
          <text x="0" y="4" text-anchor="middle" class="stack-mono" font-size="8.5" font-weight="700" fill="#f8fafc">LG</text>
        </g>
      </g>
      <!-- Planet: PyTorch -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="180; 540" dur="14s" repeatCount="indefinite"/>
        <g transform="translate(150, 0)">
          <circle cx="0" cy="0" r="13" fill="#0a1226" stroke="#ff354f" stroke-width="1.8"/>
          <text x="0" y="4" text-anchor="middle" class="stack-mono" font-size="8.5" font-weight="700" fill="#f8fafc">PT</text>
        </g>
      </g>
    </g>

    <!-- ORBIT 2: Middle Orbit (Backend & Orchestration) -->
    <g transform="rotate(22)">
      <ellipse cx="0" cy="0" rx="230" ry="68" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 4"/>
      
      <!-- Planet: FastAPI -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="60; 420" dur="20s" repeatCount="indefinite"/>
        <g transform="translate(230, 0)">
          <circle cx="0" cy="0" r="14" fill="#0a1226" stroke="#10b981" stroke-width="1.8"/>
          <text x="0" y="4" text-anchor="middle" class="stack-mono" font-size="8.5" font-weight="700" fill="#f8fafc">API</text>
        </g>
      </g>
      <!-- Planet: Qdrant / Vector DB -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="240; 600" dur="20s" repeatCount="indefinite"/>
        <g transform="translate(230, 0)">
          <circle cx="0" cy="0" r="14" fill="#0a1226" stroke="#e11d48" stroke-width="1.8"/>
          <text x="0" y="4" text-anchor="middle" class="stack-mono" font-size="8.5" font-weight="700" fill="#f8fafc">QDR</text>
        </g>
      </g>
    </g>

    <!-- ORBIT 3: Outer Orbit (Infrastructure & Protocol) -->
    <g transform="rotate(-6)">
      <ellipse cx="0" cy="0" rx="310" ry="86" fill="none" stroke="#ff354f" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="7 5"/>
      
      <!-- Planet: Docker -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="120; 480" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(310, 0)">
          <circle cx="0" cy="0" r="14" fill="#0a1226" stroke="#0284c7" stroke-width="1.8"/>
          <text x="0" y="4" text-anchor="middle" class="stack-mono" font-size="8.5" font-weight="700" fill="#f8fafc">DOC</text>
        </g>
      </g>
      <!-- Planet: FastMCP / Tool Layer -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="300; 660" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(310, 0)">
          <circle cx="0" cy="0" r="14" fill="#0a1226" stroke="#a855f7" stroke-width="1.8"/>
          <text x="0" y="4" text-anchor="middle" class="stack-mono" font-size="8.5" font-weight="700" fill="#f8fafc">MCP</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM: GROUPED STACK CHIPS ==================== -->
  <g transform="translate(42, 252)">
    <!-- Row 1: AI & AGENTIC FRAMEWORKS -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="124" height="26" rx="6" fill="#0d1833" stroke="#247bff" stroke-width="1"/>
      <text x="62" y="17" text-anchor="middle" class="stack-mono" font-size="10" font-weight="700" fill="#38bdf8">AI &amp; AGENTS</text>

      <!-- Chips -->
      <g transform="translate(136, 0)">
        <!-- LangGraph -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="98" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="49" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">LangGraph</text>
        </g>
        <!-- LangChain -->
        <g transform="translate(106, 0)">
          <rect x="0" y="0" width="94" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="47" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">LangChain</text>
        </g>
        <!-- FastMCP -->
        <g transform="translate(208, 0)">
          <rect x="0" y="0" width="86" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="43" y="17" text-anchor="middle" class="stack-chip-text" fill="#38bdf8">FastMCP</text>
        </g>
        <!-- PyTorch -->
        <g transform="translate(302, 0)">
          <rect x="0" y="0" width="84" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="42" y="17" text-anchor="middle" class="stack-chip-text" fill="#ff354f">PyTorch</text>
        </g>
        <!-- LiteLLM -->
        <g transform="translate(394, 0)">
          <rect x="0" y="0" width="82" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="41" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">LiteLLM</text>
        </g>
        <!-- RAG Architectures -->
        <g transform="translate(484, 0)">
          <rect x="0" y="0" width="156" height="26" rx="6" fill="#0f172a" stroke="#247bff" stroke-opacity="0.5"/>
          <text x="78" y="17" text-anchor="middle" class="stack-chip-text" fill="#38bdf8">Anti-Hallucination</text>
        </g>
      </g>
    </g>

    <!-- Row 2: BACKEND & HIGH-PERFORMANCE DATA -->
    <g transform="translate(0, 38)">
      <rect x="0" y="0" width="124" height="26" rx="6" fill="#0d1833" stroke="#247bff" stroke-width="1"/>
      <text x="62" y="17" text-anchor="middle" class="stack-mono" font-size="10" font-weight="700" fill="#38bdf8">BACKEND &amp; DATA</text>

      <!-- Chips -->
      <g transform="translate(136, 0)">
        <!-- Python -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="76" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="38" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">Python</text>
        </g>
        <!-- FastAPI -->
        <g transform="translate(84, 0)">
          <rect x="0" y="0" width="80" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="40" y="17" text-anchor="middle" class="stack-chip-text" fill="#10b981">FastAPI</text>
        </g>
        <!-- PostgreSQL -->
        <g transform="translate(172, 0)">
          <rect x="0" y="0" width="100" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="50" y="17" text-anchor="middle" class="stack-chip-text" fill="#38bdf8">PostgreSQL</text>
        </g>
        <!-- Qdrant -->
        <g transform="translate(280, 0)">
          <rect x="0" y="0" width="86" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="43" y="17" text-anchor="middle" class="stack-chip-text" fill="#ff354f">Qdrant</text>
        </g>
        <!-- C++ -->
        <g transform="translate(374, 0)">
          <rect x="0" y="0" width="62" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="31" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">C++</text>
        </g>
        <!-- dlt (Data Load Tool) -->
        <g transform="translate(444, 0)">
          <rect x="0" y="0" width="74" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="37" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">dlt-hub</text>
        </g>
        <!-- Pandas / NumPy -->
        <g transform="translate(526, 0)">
          <rect x="0" y="0" width="114" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="57" y="17" text-anchor="middle" class="stack-chip-text" fill="#cbd5e1">Pandas • NumPy</text>
        </g>
      </g>
    </g>

    <!-- Row 3: CLOUD & DEVOPS INFRASTRUCTURE -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="124" height="26" rx="6" fill="#0d1833" stroke="#ff354f" stroke-width="1"/>
      <text x="62" y="17" text-anchor="middle" class="stack-mono" font-size="10" font-weight="700" fill="#ff354f">CLOUD &amp; DEVOPS</text>

      <!-- Chips -->
      <g transform="translate(136, 0)">
        <!-- Docker -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="80" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="40" y="17" text-anchor="middle" class="stack-chip-text" fill="#38bdf8">Docker</text>
        </g>
        <!-- AWS Serverless -->
        <g transform="translate(88, 0)">
          <rect x="0" y="0" width="124" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="62" y="17" text-anchor="middle" class="stack-chip-text" fill="#f59e0b">AWS (Lambda/Cognito)</text>
        </g>
        <!-- DynamoDB -->
        <g transform="translate(220, 0)">
          <rect x="0" y="0" width="94" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="47" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">DynamoDB</text>
        </g>
        <!-- Git & GitHub Actions -->
        <g transform="translate(322, 0)">
          <rect x="0" y="0" width="138" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="69" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">Git &amp; GitHub Actions</text>
        </g>
        <!-- Linux / Shell -->
        <g transform="translate(468, 0)">
          <rect x="0" y="0" width="96" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="48" y="17" text-anchor="middle" class="stack-chip-text" fill="#f1f5f9">Linux / POSIX</text>
        </g>
        <!-- SSE Streaming -->
        <g transform="translate(572, 0)">
          <rect x="0" y="0" width="68" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="34" y="17" text-anchor="middle" class="stack-chip-text" fill="#10b981">SSE</text>
        </g>
      </g>
    </g>
  </g>
</svg>