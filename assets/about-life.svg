<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <defs>
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#091024"/>
    </linearGradient>

    <linearGradient id="about-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="about-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#247bff" fill-opacity="0.08"/>
    </pattern>

    <linearGradient id="about-bar-active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="about-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .about-animated { animation: none !important; }
    }
    .about-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .about-display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .about-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="857" height="357" rx="18" fill="url(#about-bg)"/>
  <rect x="1.5" y="1.5" width="857" height="357" rx="18" fill="url(#about-dots)"/>
  <rect x="1.5" y="1.5" width="857" height="357" rx="18" fill="none" stroke="url(#about-border)" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: CAPABILITIES ==================== -->
  <g transform="translate(42, 32)">
    <text x="0" y="0" class="about-mono" font-size="12" font-weight="700" fill="#247bff" letter-spacing="2">
      // CORE CAPABILITIES
    </text>

    <!-- Capability 1 -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="365" height="78" rx="12" fill="url(#about-card-grad)" stroke="#247bff" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#1e293b"/>
      <text x="28" y="33" text-anchor="middle" font-size="14">🤖</text>
      <text x="52" y="27" class="about-display" font-size="13.5" fill="#f8fafc">Autonomous Multi-Agent Swarms</text>
      <text x="52" y="46" class="about-body" font-size="11.5" fill="#94a3b8">LangGraph ReAct loops, FastMCP servers,</text>
      <text x="52" y="62" class="about-body" font-size="11.5" fill="#94a3b8">human-in-the-loop validation &amp; state engines.</text>
    </g>

    <!-- Capability 2 -->
    <g transform="translate(0, 104)">
      <rect x="0" y="0" width="365" height="78" rx="12" fill="url(#about-card-grad)" stroke="#247bff" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#1e293b"/>
      <text x="28" y="33" text-anchor="middle" font-size="14">🛡️</text>
      <text x="52" y="27" class="about-display" font-size="13.5" fill="#f8fafc">Anti-Hallucination &amp; Research RAG</text>
      <text x="52" y="46" class="about-body" font-size="11.5" fill="#94a3b8">Citation grounding, 40+ literature audit tools,</text>
      <text x="52" y="62" class="about-body" font-size="11.5" fill="#94a3b8">and semantic cross-checking pipelines.</text>
    </g>

    <!-- Capability 3 -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="365" height="78" rx="12" fill="url(#about-card-grad)" stroke="#ff354f" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#1e293b"/>
      <text x="28" y="33" text-anchor="middle" font-size="14">⚡</text>
      <text x="52" y="27" class="about-display" font-size="13.5" fill="#f8fafc">Production AI &amp; Cloud Infrastructure</text>
      <text x="52" y="46" class="about-body" font-size="11.5" fill="#94a3b8">FastAPI SSE real-time streaming, Docker,</text>
      <text x="52" y="62" class="about-body" font-size="11.5" fill="#94a3b8">AWS serverless (Lambda, Cognito, DynamoDB).</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="432" y1="36" x2="432" y2="324" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ==================== RIGHT COLUMN: 3-SLIDE CAROUSEL ==================== -->
  <g transform="translate(452, 32)">
    <g>
      <text x="0" y="0" class="about-mono" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
        // INTERESTS &amp; DRIVERS (CAROUSEL)
      </text>
      <text x="365" y="0" text-anchor="end" class="about-mono" font-size="11" fill="#64748b">4s / SLIDE</text>
    </g>

    <!-- Segment Progress Bars (3 segments) -->
    <g transform="translate(0, 16)">
      <!-- Segment 1: 0s-4s -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="116" height="4" rx="2" fill="#1e293b"/>
        <rect x="0" y="0" width="0" height="4" rx="2" fill="url(#about-bar-active)">
          <animate attributeName="width" values="0; 116; 116; 0" keyTimes="0; 0.32; 0.99; 1" dur="12s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- Segment 2: 4s-8s -->
      <g transform="translate(124, 0)">
        <rect x="0" y="0" width="116" height="4" rx="2" fill="#1e293b"/>
        <rect x="0" y="0" width="0" height="4" rx="2" fill="url(#about-bar-active)">
          <animate attributeName="width" values="0; 0; 116; 116; 0" keyTimes="0; 0.33; 0.65; 0.99; 1" dur="12s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- Segment 3: 8s-12s -->
      <g transform="translate(248, 0)">
        <rect x="0" y="0" width="116" height="4" rx="2" fill="#1e293b"/>
        <rect x="0" y="0" width="0" height="4" rx="2" fill="url(#about-bar-active)">
          <animate attributeName="width" values="0; 0; 116; 0" keyTimes="0; 0.66; 0.98; 1" dur="12s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Carousel Slides Container -->
    <g transform="translate(0, 34)">
      <!-- Outer Carousel Frame -->
      <rect x="0" y="0" width="365" height="236" rx="14" fill="url(#about-card-grad)" stroke="#247bff" stroke-opacity="0.3" stroke-width="1"/>

      <!-- SLIDE 1 (0s-4s): Open-Source Impact -->
      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.31;0.34;0.97;0.99;1" dur="12s" repeatCount="indefinite"/>
        <g transform="translate(24, 28)">
          <rect x="0" y="0" width="92" height="22" rx="6" fill="#0f172a" stroke="#247bff" stroke-width="1"/>
          <text x="46" y="15" text-anchor="middle" class="about-mono" font-size="10.5" font-weight="700" fill="#38bdf8">SLIDE 01 / 03</text>
          
          <text x="0" y="52" class="about-display" font-size="18" fill="#ffffff">🚀 Open-Source Ecosystem</text>
          <text x="0" y="74" class="about-mono" font-size="12" fill="#247bff">UPSTREAM CODEBASE CONTRIBUTOR</text>

          <text x="0" y="104" class="about-body" font-size="13" fill="#cbd5e1" line-height="1.5">
            Active upstream contributor to industry-standard AI
          </text>
          <text x="0" y="126" class="about-body" font-size="13" fill="#cbd5e1">
            infrastructure including <tspan font-weight="700" fill="#ffffff">LiteLLM</tspan>, <tspan font-weight="700" fill="#ffffff">dlt-hub</tspan>,
          </text>
          <text x="0" y="148" class="about-body" font-size="13" fill="#cbd5e1">
            <tspan font-weight="700" fill="#ffffff">Qdrant Client</tspan>, and <tspan font-weight="700" fill="#ffffff">txtai</tspan>.
          </text>

          <g transform="translate(0, 168)">
            <rect x="0" y="0" width="317" height="26" rx="6" fill="#070b16" stroke="#247bff" stroke-opacity="0.3" stroke-width="1"/>
            <text x="12" y="17" class="about-mono" font-size="11" fill="#38bdf8">★ Merged PRs in core developer pipelines</text>
          </g>
        </g>
      </g>

      <!-- SLIDE 2 (4s-8s): Flagship CiteProof AI -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.35;0.64;0.67;1" dur="12s" repeatCount="indefinite"/>
        <g transform="translate(24, 28)">
          <rect x="0" y="0" width="92" height="22" rx="6" fill="#0f172a" stroke="#ff354f" stroke-width="1"/>
          <text x="46" y="15" text-anchor="middle" class="about-mono" font-size="10.5" font-weight="700" fill="#ff354f">SLIDE 02 / 03</text>
          
          <text x="0" y="52" class="about-display" font-size="18" fill="#ffffff">🛡️ CiteProof AI Flagship</text>
          <text x="0" y="74" class="about-mono" font-size="12" fill="#ff354f">ANTI-HALLUCINATION PLATFORM</text>

          <text x="0" y="104" class="about-body" font-size="13" fill="#cbd5e1">
            Pioneered a 40-tool Model Context Protocol (MCP)
          </text>
          <text x="0" y="126" class="about-body" font-size="13" fill="#cbd5e1">
            server that orchestrates parallel researcher agents to
          </text>
          <text x="0" y="148" class="about-body" font-size="13" fill="#cbd5e1">
            fact-check academic literature with zero hallucinations.
          </text>

          <g transform="translate(0, 168)">
            <rect x="0" y="0" width="317" height="26" rx="6" fill="#070b16" stroke="#ff354f" stroke-opacity="0.3" stroke-width="1"/>
            <text x="12" y="17" class="about-mono" font-size="11" fill="#ff354f">★ LangGraph ReAct + FastAPI SSE Streaming</text>
          </g>
        </g>
      </g>

      <!-- SLIDE 3 (8s-12s): High-Speed Engineering & Community -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.65;0.67;0.96;0.98;1" dur="12s" repeatCount="indefinite"/>
        <g transform="translate(24, 28)">
          <rect x="0" y="0" width="92" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
          <text x="46" y="15" text-anchor="middle" class="about-mono" font-size="10.5" font-weight="700" fill="#10b981">SLIDE 03 / 03</text>
          
          <text x="0" y="52" class="about-display" font-size="18" fill="#ffffff">🌐 Autonomous Systems R&amp;D</text>
          <text x="0" y="74" class="about-mono" font-size="12" fill="#10b981">ZERO-CLOUD-FEE INNOVATION</text>

          <text x="0" y="104" class="about-body" font-size="13" fill="#cbd5e1">
            Created FreeJobAgent (Gemini API + FastMCP)
          </text>
          <text x="0" y="126" class="about-body" font-size="13" fill="#cbd5e1">
            and Speech-To-Text-Selenium (cloud-free voice
          </text>
          <text x="0" y="148" class="about-body" font-size="13" fill="#cbd5e1">
            browser automation via headless Chrome).
          </text>

          <g transform="translate(0, 168)">
            <rect x="0" y="0" width="317" height="26" rx="6" fill="#070b16" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
            <text x="12" y="17" class="about-mono" font-size="11" fill="#10b981">★ Pragmatic, Cost-Effective AI Architecture</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>